[package]
name = "sudolang-lsp"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Structural language server for SudoLang (diagnostics + deterministic formatter)"
repository = "https://github.com/dylan-gluck/sudolang-lsp"
authors = ["Dylan Navajas Gluck"]
readme = "README.md"
keywords = ["sudolang", "lsp", "tree-sitter", "language-server"]
categories = ["development-tools"]
# examples/format_canonical.rs include_str!s the sibling grammar checkout;
# keep it out of the published crate.
exclude = ["examples/"]

[[bin]]
name = "sudolang-lsp"
path = "src/main.rs"

[lib]
name = "sudolang_lsp"
path = "src/lib.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
# Local path for development (workspace sibling; CI checks the grammar out
# alongside). `cargo publish` strips the path and resolves the crates.io
# version — publish the grammar crate first.
tree-sitter-sudolang = { path = "../tree-sitter-sudolang", version = "0.3.0" }
dashmap = "5"
ropey = "1"

[dev-dependencies]
pretty_assertions = "1"
