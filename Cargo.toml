[package]
name = "sudolang-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Structural language server for SudoLang (diagnostics + deterministic formatter)"
repository = "https://github.com/dylan-gluck/sudolang-lsp"
authors = ["Dylan Navajas Gluck"]
readme = "README.md"
keywords = ["sudolang", "lsp", "tree-sitter", "language-server"]
categories = ["development-tools"]

[[bin]]
name = "sudolang-lsp"
path = "src/main.rs"

[lib]
name = "sudolang_lsp"
path = "src/lib.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-sudolang = { git = "https://github.com/dylan-gluck/tree-sitter-sudolang", tag = "v0.1.1" }
dashmap = "5"
ropey = "1"

[dev-dependencies]
pretty_assertions = "1"
